<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0e1117">
  <title>Horizon</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>
</head>
<body>
  {% raw %}
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">●</span>
        <router-link to="/" class="brand-text">Horizon</router-link>
      </div>
      <nav class="nav">
        <router-link to="/" exact-active-class="active">Home</router-link>
        <router-link to="/market-check" active-class="active">Market</router-link>
        <router-link to="/research" active-class="active">Research</router-link>
        <router-link to="/trades" active-class="active">Trades</router-link>
        <router-link to="/smart-money" active-class="active">Smart Money</router-link>
        <router-link to="/settings" active-class="active">Settings</router-link>
      </nav>
      <div class="gate" :class="gateClass" v-if="gate">
        <span class="dot"></span>
        <span class="label">{{ gateLabel }}</span>
        <span class="size" v-if="gate.position_size_pct != null">{{ gate.position_size_pct }}%</span>
      </div>
    </header>
    <main class="content">
      <router-view :gate="gate" @gate-updated="loadGate"></router-view>
    </main>
  </div>
  {% endraw %}
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
