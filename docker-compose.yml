services:
  horizon:
    build:
      context: ..
      dockerfile: Horizon/Dockerfile
    image: horizon:latest
    container_name: horizon
    ports:
      - "5001:5001"
    volumes:
      - ./data:/app/data
    environment:
      - FLASK_DEBUG=0
      - PORT=5001
      - SMART_MONEY_DIR=/app/smart_money
      - SMART_MONEY_DB_PATH=/app/data/smart_money.db
      - HORIZON_DB_PATH=/app/data/horizon.db
      - SEC_IDENTITY=${SEC_IDENTITY:-drew.pfitzner@gmail.com}
    restart: unless-stopped
